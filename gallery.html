<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Infyreach</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#07162f;
    color:#fff;
}


/* Header Same as Home */

header{
    width:100%;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(8px);
}


.navbar{

    width:90%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 0;

}


.logo{

    font-size:34px;
    font-weight:bold;

}


.logo span{

    color:gold;

}



.nav-links{

    list-style:none;
    display:flex;

}


.nav-links li{

    margin-left:30px;

}


.nav-links a{

    color:gold;
    font-size:17px;
    text-decoration:underline;
    transition:.3s;

}


.nav-links a:hover{

    color:#1e90ff;

}



/* Blank Gallery Page */

.gallery-page{

    min-height:100vh;
    padding:120px 8% 80px;

}



/* Footer */

footer{

    text-align:center;
    background:#02101f;
    padding:25px;

}


footer h3{

    color:gold;
    margin-bottom:10px;

}


footer p{

    font-size:14px;

}



/* Mobile */

@media(max-width:900px){

.nav-links{

    display:none;

}

}

</style>

</head>


<body>


<header>


<div class="navbar">


<div class="logo">

Infy<span>reach</span>

</div>


<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="capabilities.html">Capabilities</a></li>
<li><a href="gallery.html">Gallery</a></li>
<li><a href="contact.html">Contact</a></li>

</ul>


</div>


</header>



<section class="gallery-page">


</section>



<footer>


<h3>Infyreach Digital Marketing Company</h3>

<p>© Infyreach Solutions Pvt.Ltd.All Rights Reserved</p>


</footer>


</body>
</html>
