<title>Gallery | Infyreach</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#07162f;
    color:#fff;
}

/* Header */

header{
    width:100%;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(8px);
}

.navbar{
    width:90%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 0;
}

.logo{
    font-size:34px;
    font-weight:bold;
}

.logo span{
    color:gold;
}

.nav-links{
    list-style:none;
    display:flex;
}

.nav-links li{
    margin-left:30px;
}

.nav-links a{
    color:gold;
    font-size:17px;
    text-decoration:underline;
    transition:.3s;
}

.nav-links a:hover{
    color:#1e90ff;
}

/* Gallery */

.gallery-page{
    min-height:100vh;
    padding:120px 8% 80px;
}

.gallery-title{
    text-align:center;
    font-size:40px;
    color:gold;
    margin-bottom:40px;
}

.video-gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:30px;
}

.video-box{
    background:#0d2345;
    padding:15px;
    border-radius:12px;
    border:2px solid gold;
    text-align:center;
}

/* YouTube Videos */

.video-box iframe{
    width:100%;
    height:300px;
    border:none;
    border-radius:10px;
    background:#000;
    display:block;
}

.video-box h3{
    margin-top:12px;
    color:gold;
    font-size:20px;
}

/* Footer */

footer{
    text-align:center;
    background:#02101f;
    padding:25px;
}

footer h3{
    color:gold;
    margin-bottom:10px;
}

footer p{
    font-size:14px;
}

/* Mobile */

@media(max-width:900px){

    .nav-links{
        display:none;
    }

    .video-gallery{
        grid-template-columns:1fr;
    }

    .video-box iframe{
        height:220px;
    }

}

</style>

</head>
